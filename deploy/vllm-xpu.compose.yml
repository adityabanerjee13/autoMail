# vLLM on an Intel Arc iGPU, under Docker Desktop's WSL2 backend on Windows.
#
#   docker compose -f deploy/vllm-xpu.compose.yml up -d
#   docker compose -f deploy/vllm-xpu.compose.yml logs -f
#   curl http://127.0.0.1:8000/v1/models
#
# The handoff prefers bare systemd for vLLM, on the grounds that GPU
# passthrough in a container "adds a debugging layer that buys nothing on a
# single machine". That reasoning holds on the Linux/NVIDIA target box, and
# deploy/systemd/vllm.service is still how it runs there. It does not hold
# here: Windows has no systemd, vLLM publishes no Windows wheel, and its XPU
# target is Linux-only -- so a container is not the convenient option, it is
# the only one. The handoff was also right about the debugging layer; see the
# /dev/dri workaround below for what it cost.
#
# How the GPU gets in:
#   /dev/dxg              WSL2's paravirtualized GPU device
#   /usr/lib/wsl:ro       libdxcore.so, which Intel's Level Zero runtime in
#                         the image talks to in place of a native kernel driver
# Verify with:
#   docker compose -f deploy/vllm-xpu.compose.yml exec vllm python3 -c \
#     "import torch; print(torch.xpu.get_device_name(0))"
# It must name an Intel device. If it raises or reports none, the passthrough
# is broken and vLLM will fall back to CPU rather than fail.

services:
  vllm:
    image: intel/vllm:0.21.0-xpu
    container_name: triage-vllm
    restart: unless-stopped

    devices:
      - /dev/dxg
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro
      # Named volume, so re-creating the container does not re-download 6.1 GB
      # of weights.
      - hf-cache:/root/.cache/huggingface

    # Single source of truth for every tunable. These land in the container's
    # environment, and the startup script below reads them from there -- which
    # is why this file needs no `docker compose --env-file` to work.
    env_file:
      - vllm-xpu.env

    ports:
      # Loopback only. This endpoint has no authentication.
      - "127.0.0.1:8000:8000"

    # vLLM's workers talk over shared memory; the 64 MB default deadlocks them.
    ipc: host
    shm_size: "4gb"

    # Do NOT set `entrypoint:`. The image's own entrypoint is
    #   bash -c "source /opt/intel/oneapi/setvars.sh --force && exec \"$$@\""
    # and that setvars.sh is what puts oneCCL, MKL and the SYCL runtime on the
    # library path. Override it and torch fails to import with
    # `libccl.so.1: cannot open shared object file` before vLLM gets anywhere
    # near the GPU. It is also why LD_LIBRARY_PATH in vllm-xpu.env is safe to
    # set: setvars.sh appends to it rather than replacing it.
    #
    # `$$` escapes Compose interpolation, so the literal `$VAR` reaches the
    # shell inside the container and is expanded there from env_file.
    command:
      - bash
      - -c
      - |
        # --- oneCCL /dev/dri workaround -------------------------------------
        # vLLM's XPU worker runs a warm-up all_reduce in init_device() even at
        # tensor_parallel_size=1 (v1/worker/xpu_worker.py). That goes through
        # oneCCL, whose ze_fd_manager opens /dev/dri/by-path/ and requires at
        # least one *-render entry:
        #   ze_fd_manager.cpp:144 init_device_fds: opendir failed
        #   ze_fd_manager.cpp:203 fill_device_fds: device names are empty
        # WSL2 has no /dev/dri at all -- the GPU arrives as /dev/dxg -- so the
        # engine dies before loading a single weight. With one rank there is no
        # collective traffic and the fd is never used for anything, so an
        # openable placeholder is enough to get past the check. Verified: this
        # is the only one of nine attempted workarounds that reaches
        # "ALL_REDUCE OK" (CCL_ZE_ENABLE=0 fails later with "ze_data was not
        # initialized"; every CCL_ZE_IPC_EXCHANGE mode still opens the dir).
        # Remove this the day either WSL exposes /dev/dri or vLLM skips the
        # warm-up for single-device runs.
        mkdir -p /dev/dri/by-path
        ln -sf /dev/null /dev/dri/by-path/pci-0000_00_02.0-render

        exec vllm serve "$$MODEL" \
          --served-model-name "$$SERVED_MODEL_NAME" \
          --host 0.0.0.0 \
          --port "$$PORT" \
          --gpu-memory-utilization "$$GPU_MEMORY_UTILIZATION" \
          --max-model-len "$$MAX_MODEL_LEN" \
          --max-num-seqs "$$MAX_NUM_SEQS" \
          --quantization "$$QUANTIZATION" \
          --attention-backend "$$ATTENTION_BACKEND"
        # No --device flag: vLLM removed it and detects the platform itself.
        # --attention-backend is a CLI flag now; VLLM_ATTENTION_BACKEND was
        # removed from envs.py, so setting it as an env var silently does
        # nothing and you get the Xe2-only FlashAttention kernel anyway.
        # No --guided-decoding-backend: removed in vLLM 0.12.0. The schema
        # rides on each request instead (llm/client.py sends structured_outputs).

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      # Cold start loads 6.1 GB of weights and compiles kernels; do not let
      # the healthcheck mark it unhealthy while that is still happening.
      start_period: 15m
      retries: 3

volumes:
  hf-cache:
